# DeskFlow-VLA live CI. NOTE: GitHub only executes workflows in
# `.github/workflows/` — `.agents/workflows/pr-merge-squash.yml` is the
# agent-facing mirror/spec of the same pipeline. Keep the job list in sync:
# edge tests -> graph check -> web build. Merging stays human/skill-gated
# (see `.agents/skills/pr-ship/`); this workflow validates, never merges.
name: CI

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  edge-tests:
    name: Edge CBF + sandbox unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  graph-check:
    name: Architecture graph validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate graph refs
        run: node graphify/render_graph.js --check

  docs-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check relative doc links
        run: node docs/check-links.mjs

  web-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CLERK_SECRET_KEY: dummy
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: dummy
