[env:deskflow-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_FREERTOS_HZ=1000
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio.git
  # NOTE: no servo library — the STS3215 SMS/STS packet driver is hand-rolled
  # in esp32_firmware.ino (single-wire half-duplex, echo-drain, SYNC_WRITE).
