name: Agent PR — CBF & Build Checks → Squash & Merge → Delete Branch

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  cbf-tests:
    name: CBF safety unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-edge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run CBF + fallback unit tests
        run: pytest -q

  web-build:
    name: Next.js build validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CLERK_SECRET_KEY: dummy
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: dummy

  open-merge-cleanup:
    name: Open PR → Squash & Merge → Delete branch
    runs-on: ubuntu-latest
    needs: [cbf-tests, web-build]
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR to main (idempotent)
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`, base: 'main', state: 'open',
            });
            let pr = prs[0];
            if (!pr) {
              const { data } = await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo,
                head: branch, base: 'main',
                title: `🤖 ${branch} → main`,
                body: 'Automated agent PR. CBF tests + Next.js build passed.\n\nSquash & merge, then delete branch.',
              });
              pr = data;
            }
            core.setOutput('number', pr.number);
            core.setOutput('head', branch);
          result-encoding: string
      - name: Squash & merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = Number('${{ steps.pr.outputs.number }}');
            await github.rest.pulls.merge({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr_number, merge_method: 'squash',
              commit_title: `🤖 squash: ${{ steps.pr.outputs.head }}`,
            });
      - name: Delete agent branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `heads/${{ steps.pr.outputs.head }}`,
            });
